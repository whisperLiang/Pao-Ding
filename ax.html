<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Awesome-pyecharts</title>
        <script type="text/javascript" src="https://assets.pyecharts.org/assets/echarts.min.js"></script>
    </head>
    <body>
        <div id="main" style="width:1800px; height:800px;"></div>
        <script>
            var myChart = echarts.init(
                document.getElementById('main'), 'white', {renderer: 'canvas'});
            var option = {
                "animation": true,
                "animationThreshold": 2000,
                "animationDuration": 1000,
                "animationEasing": "cubicOut",
                "animationDelay": 0,
                "animationDurationUpdate": 300,
                "animationEasingUpdate": "cubicOut",
                "animationDelayUpdate": 0,
                "color": [
                    "#c23531",
                    "#2f4554",
                    "#61a0a8",
                    "#d48265",
                    "#749f83",
                    "#ca8622",
                    "#bda29a",
                    "#6e7074",
                    "#546570",
                    "#c4ccd3",
                    "#f05b72",
                    "#ef5b9c",
                    "#f47920",
                    "#905a3d",
                    "#fab27b",
                    "#2a5caa",
                    "#444693",
                    "#726930",
                    "#b2d235",
                    "#6d8346",
                    "#ac6767",
                    "#1d953f",
                    "#6950a1",
                    "#918597"
                ],
            "series": [
                {
                    "type": "graph",
                    "layout": "force",
                    "symbol": "rect",  // 把标识点设置为矩形，以便label在上面显示，矩形长度在data中设置
                    "circular": {
                        "rotateLabel": false
                    },
                    "force": {
                        "repulsion": 1000,  // 斥力较大会让点之间较为分散
                        "layoutAnimation": false
                    },
                    "label": {
                        "show": true,
                        "position": "inside",
                        //"backgroundColor": "auto",
                        //"margin": 2,
                        //"padding": 2
                    },
                    "lineStyle": {
                        "width": 1,
                        "opacity": 1,
                        "curveness": 0,
                        "type": "solid"
                    },
                    "roam": true,
                    "focusNodeAdjacency": true,
                    "data": [{'name': '0,InputModule', 'symbolSize': [91, 20], 'tooltip': {'formatter': 'dnn.ipt'}}, {'name': '1,Conv2d', 'symbolSize': [56, 20], 'tooltip': {'formatter': 'dnn.0'}}, {'name': '2,ReLU', 'symbolSize': [42, 20], 'tooltip': {'formatter': 'dnn.1'}}, {'name': '3,MaxPool2d', 'symbolSize': [77, 20], 'tooltip': {'formatter': 'dnn.2'}}, {'name': '4,Conv2d', 'symbolSize': [56, 20], 'tooltip': {'formatter': 'dnn.3'}}, {'name': '5,ReLU', 'symbolSize': [42, 20], 'tooltip': {'formatter': 'dnn.4'}}, {'name': '6,MaxPool2d', 'symbolSize': [77, 20], 'tooltip': {'formatter': 'dnn.5'}}, {'name': '7,Conv2d', 'symbolSize': [56, 20], 'tooltip': {'formatter': 'dnn.6'}}, {'name': '8,ReLU', 'symbolSize': [42, 20], 'tooltip': {'formatter': 'dnn.7'}}, {'name': '9,Conv2d', 'symbolSize': [56, 20], 'tooltip': {'formatter': 'dnn.8'}}, {'name': '10,ReLU', 'symbolSize': [49, 20], 'tooltip': {'formatter': 'dnn.9'}}, {'name': '11,Conv2d', 'symbolSize': [63, 20], 'tooltip': {'formatter': 'dnn.10'}}, {'name': '12,ReLU', 'symbolSize': [49, 20], 'tooltip': {'formatter': 'dnn.11'}}, {'name': '13,MaxPool2d', 'symbolSize': [84, 20], 'tooltip': {'formatter': 'dnn.12'}}],
                    "edgeSymbol": [  // 边的一头是空，另一头是箭头
                        "none",
                        "arrow"
                    ],
                    "draggable": true,  // 支持拖拽
                    "edgeSymbolSize": 10,
                    "links": [{'source': 0, 'target': 1}, {'source': 1, 'target': 2}, {'source': 2, 'target': 3}, {'source': 3, 'target': 4}, {'source': 4, 'target': 5}, {'source': 5, 'target': 6}, {'source': 6, 'target': 7}, {'source': 7, 'target': 8}, {'source': 8, 'target': 9}, {'source': 9, 'target': 10}, {'source': 10, 'target': 11}, {'source': 11, 'target': 12}, {'source': 12, 'target': 13}],
                }],
                "legend": [
                    {
                        "data": [],
                        "selected": {}
                    }
                ],
                "tooltip": {
                    "show": true,
                    "trigger": "item",
                    "triggerOn": "mousemove|click",
                    "axisPointer": {
                        "type": "line"
                    },
                    "textStyle": {
                        "fontSize": 14
                    },
                    "borderWidth": 0
                }
            };
            myChart.setOption(option);
            // 支持拖拽不恢复原位
            myChart.on('mouseup',function(params){
                var option=myChart.getOption();
                option.series[0].data[params.dataIndex].x=params.event.offsetX;
                option.series[0].data[params.dataIndex].y=params.event.offsetY;
                option.series[0].data[params.dataIndex].fixed=true;
                myChart.setOption(option);
            });
        </script>
    </body>
</html>
