# Configuration file path of logging
log_cfg: logging.yml

# Local ports listened by each service
port:
  master: 11111
  trainer: 22210
  worker: [33320, 33321, 33322]
# Network address when accessing. m, t, w0 correspond to master, trainer, worker0 respectively.
net:
#  m->t: 'localhost:22210'
#  m->w0: 'localhost:33320'
#  m->w1: 'localhost:33321'
#  w0->w1: 'localhost:33321'
  # m->t: '192.168.0.100:22210'
  # m->w0: '192.168.0.112:33320'
  # m->w1: '192.168.0.121:33321'
  # w0->w1: '192.168.0.121:33321'
  m->t: '192.168.0.204:22210'
  m->w0: '192.168.0.113:33320'
  m->w1: '192.168.0.114:33321'
  m->w2: '192.168.0.114:33322'
  w0->w1: '192.168.0.114:33321'
  w1->w2: '192.168.0.115:33322' 

# DNN load function, use this to choose dnn
dnn_loader: !!python/name:dnn_models.any_dnn_split.prepare_alexnet
# dnn_loader: !!python/name:dnn_models.any_dnn_split.prepare_vgg16
# dnn_loader: !!python/name:dnn_models.any_dnn_split.prepare_resnet18
# dnn_loader: !!python/name:dnn_models.any_dnn_split.prepare_resnet50
# dnn_loader: !!python/name:dnn_models.any_dnn_split.prepare_googlenet
# dnn_loader: !!python/name:dnn_models.any_dnn_split.prepare_regnet
# dnn_loader: !!python/name:dnn_models.any_dnn_split.prepare_inception_v3
# Path of the input video file
video_path: media/parking.mp4
# Adjust the input frame to [nrow, ncol], which is a tuple of two int. None indicates don't resize.
frame_size: !!python/tuple [480, 720]
# "itg" or "dif". This option generates two corresponding options: executor_type and job_type
mode: dif
# Whether check the correctness of result
check: !!bool false

# Configuration of master
master:
  ifr_num: 10  # Total frame to be processed
  pd_num: 0  # How many frames are pending at the same time, 0 means unlimited
  itv_time: 0  # How long to wait after issuing an IFR, for debugging only. Normally it should be 0
  # len(bandwidth) must be equal to len(worker).
  # bandwidth[w] = bandwidth(MB) between w-1 and w. bandwidth[0] refers to master and worker0.
  bandwidth: [3, 3, 3]
  scheduler: !!python/name:schedulers.my_scheduler.MyScheduler
  # scheduler: !!python/name:schedulers.lb_scheduler.LBScheduler
  LBScheduler:
  MyScheduler:
    gp_size: 3  # The number of frames a group contains. A group of frames will use the same scheduling policy
  OSCScheduler:
    side: edge  # edge/cloud
  NSCScheduler:
# Configuration of worker
worker:
  prof_niter: 5
# Configuration of trainer
trainer:
  frame_num: 400