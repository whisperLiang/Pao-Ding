
version: '3.8'
x-paoding-common: &paoding-common
  image: pao-ding:1.0
  volumes:
    - /home/yons/.cache/torch/hub/checkpoints:/root/.cache/torch/hub/checkpoints/
    - /home/yons/whisperliang/Pao-Ding:/Pao-Ding
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1G  

networks:
  paoding-network:
    driver: bridge
    ipam:
      config:
        - subnet: 174.28.0.0/24

services:
  paoding-master-trainer:
    image: pao-ding:1.0
    volumes:
      - /home/yons/.cache/torch/hub/checkpoints:/root/.cache/torch/hub/checkpoints/
      - /home/yons/whisperliang/Pao-Ding:/Pao-Ding
    command: python3 main.py trainer
    networks:
      paoding-network:
        ipv4_address: 174.28.0.2
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  paoding-worker0:
    <<: *paoding-common
    command: python3 main.py worker -i 0
    networks:
      paoding-network:
        ipv4_address: 174.28.0.3
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  paoding-worker1:
    <<: *paoding-common
    command: python3 main.py worker -i 1
    networks:
      paoding-network:
        ipv4_address: 174.28.0.4
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  paoding-worker2:
    <<: *paoding-common
    command: python3 main.py worker -i 2
    networks:
      paoding-network:
        ipv4_address: 174.28.0.5
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
