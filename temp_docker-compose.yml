
version: '3.8'
x-paoding-common: &paoding-common
  image: pao-ding:1.0
  volumes:
    - /home/yons/.cache/torch/hub/checkpoints:/root/.cache/torch/hub/checkpoints/
    - /home/yons/whisperliang/Pao-Ding:/Pao-Ding
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 2G  

networks:
  paoding-network:
    driver: bridge
    ipam:
      config:
        - subnet: 174.28.0.0/24

services:
  paoding-master-trainer:
    image: pao-ding:1.0
    cpuset: "8-9"
    volumes:
      - /home/yons/.cache/torch/hub/checkpoints:/root/.cache/torch/hub/checkpoints/
      - /home/yons/whisperliang/Pao-Ding:/Pao-Ding
    command: python3 main.py trainer
    networks:
      paoding-network:
        ipv4_address: 174.28.0.2
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8000 || exit 1"]
      interval: 7s
      timeout: 5s
      retries: 100

  paoding-worker7:
    <<: *paoding-common
    cpuset: "11"
    command: python3 main.py worker -i 7
    networks:
      paoding-network:
        ipv4_address: 174.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8000 || exit 1"]
      interval: 7s
      timeout: 5s
      retries: 100

