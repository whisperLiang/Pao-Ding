  #       condition: service_healthy

  # paoding-trainer:
  #   <<: *paoding-common
  #   command: python3 main.py trainer
  #   networks:
  #     paoding-network:
  #       ipv4_address: 174.28.0.2
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 20

  # execute python3 main.py master in docker paoding-master-trainer
  # make sure that pumba script works
  paoding-master-trainer:
    <<: *paoding-common
    command: python3 main.py trainer
    networks:
      paoding-network:
        ipv4_address: 174.28.0.2
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 3s
      timeout: 3s
      retries: 100

  paoding-worker0:
    <<: [*paoding-common, *resources-common]
    command: python3 main.py worker -i 0
    networks:
      paoding-network:
        ipv4_address: 174.28.0.3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 3s
      timeout: 3s
      retries: 20

  paoding-worker1:
    <<: [*paoding-common, *resources-common]
    command: python3 main.py worker -i 1
    networks:
      paoding-network:
        ipv4_address: 174.28.0.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 3s
      timeout: 3s
      retries: 20

